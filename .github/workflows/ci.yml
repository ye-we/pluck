name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install clipboard tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip xsel
      - name: Test, including the real Linux clipboard
        run: PLUCK_CLIPBOARD_TEST=1 xvfb-run -a go test -race ./...
      # The plugin runs these programs after every Claude reply, and a changed
      # binary can't be reviewed in a diff, so prove they come from this source.
      - name: dist/ matches the source
        run: ./scripts/build.sh && git diff --exit-code --stat dist/
